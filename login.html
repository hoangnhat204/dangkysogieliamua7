<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập - Đường Lên Đỉnh Sogielia Mùa 7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell">
    <div class="container">
      <nav class="site-nav">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Sogielia Mùa 7</span>
        </a>
      </nav>

      <main class="login-shell">
        <div class="login-card">
          <section class="panel">
            <div class="section-kicker">Khu vực BTC</div>
            <h1 class="page-title login-title">Đăng Nhập Admin</h1>

            <form id="loginForm" novalidate>
              <div class="form-grid">
                <div class="field full">
                  <label for="username">Tài khoản</label>
                  <input id="username" name="username" type="text" placeholder="Nhập tài khoản admin" required />
                </div>

                <div class="field full">
                  <label for="password">Mật khẩu</label>
                  <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required />
                </div>
              </div>

              <div class="login-actions">
                <button class="button button-primary" type="submit">Đăng nhập</button>
                <a class="button button-secondary" href="index.html">Quay lại trang chủ</a>
              </div>

              <div class="success-message" id="loginMessage" aria-live="polite"></div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>

  <footer class="footer">
    ĐƯỜNG LÊN ĐỈNH SOGIELIA MÙA 7 - ĐĂNG NHẬP ADMIN
  </footer>

  <script src="script.js"></script>
</body>
</html>
