<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Đường Lên Đỉnh Sogielia Mùa 7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell">
    <div class="container">
      <nav class="site-nav">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Sogielia Mùa 7</span>
        </a>
        <div class="nav-links">
          <a class="active" href="admin.html">Admin</a>
          <button class="nav-button" id="logoutButton" type="button">Đăng xuất</button>
        </div>
      </nav>

      <header class="page-hero">
        <div class="section-card">
          <p class="page-subtitle">Quản lý dữ liệu thí sinh</p>
        </div>
      </header>

      <main>
        <section class="section-card">
          <div class="toolbar print-hidden">
            <div class="toolbar-main">
              <span class="count-pill" id="submissionCount">0 hồ sơ trong cơ sở dữ liệu admin</span>
              <div class="toolbar-search">
                <label class="sr-only" for="submissionSearch">Tìm theo tên</label>
                <input id="submissionSearch" type="search" placeholder="Tìm nhanh theo tên thí sinh" />
              </div>
            </div>
            <div class="toolbar-actions">
              <button class="button button-secondary" id="exportExcelBtn" type="button">Xuất Excel</button>
              <button class="button button-secondary" id="hideSelectedBtn" type="button" disabled>Ẩn thí sinh đã chọn</button>
              <button class="button button-secondary" id="restoreDataBtn" type="button" hidden>Hiện lại dữ liệu ẩn</button>
              <button class="button button-secondary" id="hideDataBtn" type="button">Ẩn dữ liệu</button>
            </div>
          </div>

          <div class="panel empty-state" id="emptyState">
            Chưa có hồ sơ nào trong cơ sở dữ liệu admin đang hiển thị.
          </div>

          <div class="data-list" id="submissionList"></div>
        </section>
      </main>
    </div>
  </div>

  <footer class="footer">
    ĐƯỜNG LÊN ĐỈNH SOGIELIA MÙA 7 - TRANG ADMIN
  </footer>
  <script src="script.js"></script>
</body>
</html>
